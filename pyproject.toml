[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dawloop"
version = "0.2.0a0"
description = "Closed-loop DAW automation framework for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ryurikoneko" }]
dependencies = []

[project.optional-dependencies]
flstudio = [
    "fastmcp>=2.0,<3",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pynput>=1.7",
]
production = [
    "numpy>=1.24",
]
production-mix = [
    "numpy>=1.24",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]
production-loopback = [
    "numpy>=1.24",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]
production-full = [
    "numpy>=1.24",
    "pillow>=10",
    "scipy>=1.10",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]

[project.scripts]
dawloop = "dawloop.cli:main"

[tool.setuptools.packages.find]
where = ["src", "third_party/fl-studio-mcp/src"]
include = ["dawloop*", "fl_studio_mcp*"]
namespaces = false

[tool.setuptools.data-files]
"share/dawloop/third_party/fl-studio-mcp" = [
    "third_party/fl-studio-mcp/LICENSE",
    "third_party/fl-studio-mcp/README.md",
    "third_party/fl-studio-mcp/pyproject.toml",
]
"share/dawloop/third_party/fl-studio-mcp/fl_controller" = [
    "third_party/fl-studio-mcp/fl_controller/device_FLStudioMCP.py",
]
"share/dawloop/third_party/fl-studio-mcp/scripts" = [
    "third_party/fl-studio-mcp/scripts/ComposeWithLLM.pyscript",
]
"share/dawloop/third_party/whale-music-pipeline" = [
    "third_party/whale-music-pipeline/LICENSE",
]
