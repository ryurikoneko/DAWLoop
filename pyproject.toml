[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dawloop"
version = "0.2.0a1"
description = "Experimental structured music planning and evidence-aware FL Studio agent runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "AUTHORS", "LICENSE_POLICY.md", "TRADEMARKS.md", "LICENSES/*.txt"]
requires-python = ">=3.11"
authors = [{ name = "ryurikoneko" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/ryurikoneko/DAWLoop"
Issues = "https://github.com/ryurikoneko/DAWLoop/issues"
Documentation = "https://github.com/ryurikoneko/DAWLoop/blob/main/docs/DEPLOYMENT.md"
Changelog = "https://github.com/ryurikoneko/DAWLoop/releases"

[project.optional-dependencies]
learning = ["jsonschema>=4.18,<5"]
mcp = [
    "fastmcp>=2.14.7,<3",
]
native = [
    "websocket-client>=1.8,<2",
    "jsonschema>=4.18,<5",
]
flstudio = [
    "fastmcp>=2.0,<3",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pynput>=1.7",
]
production = [
    "numpy>=1.24",
]
production-mix = [
    "numpy>=1.24",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]
production-loopback = [
    "numpy>=1.24",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]
production-full = [
    "numpy>=1.24",
    "pillow>=10",
    "scipy>=1.10",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]

[project.scripts]
dawloop = "dawloop.cli:main"
dawloop-mcp = "dawloop.fast_mcp_server:main"

[tool.setuptools.packages.find]
where = ["src", "third_party/fl-studio-mcp/src"]
include = ["dawloop*", "fl_studio_mcp*"]
namespaces = false

[tool.setuptools.package-data]
"dawloop.learning" = ["schemas/*.json"]
"dawloop.runtime" = ["fixtures/reviewed_accept_four_note.npz", "fixtures/reviewed_accept_four_note.json"]
"dawloop.adapters.gopher_native" = ["bridge.js", "known_catalog.json"]
"dawloop.fl_scripts" = ["*.pyscript"]

[tool.setuptools.data-files]
"share/dawloop" = ["CITATION.cff"]
"share/dawloop/third_party/fl-studio-mcp" = [
    "third_party/fl-studio-mcp/LICENSE",
    "third_party/fl-studio-mcp/README.md",
    "third_party/fl-studio-mcp/pyproject.toml",
]
"share/dawloop/third_party/fl-studio-mcp/fl_controller" = [
    "third_party/fl-studio-mcp/fl_controller/device_FLStudioMCP.py",
]
"share/dawloop/third_party/fl-studio-mcp/scripts" = [
    "third_party/fl-studio-mcp/scripts/ComposeWithLLM.pyscript",
]
"share/dawloop/third_party/whale-music-pipeline" = [
    "third_party/whale-music-pipeline/LICENSE",
]
