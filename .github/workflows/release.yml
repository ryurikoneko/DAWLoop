name: Release provenance

on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Attested build
    needs: [tests]
    if: github.repository == 'ryurikoneko/DAWLoop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require current main or a trusted signed tag on main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_guard.py "$RELEASE_TAG"
            git config gpg.format ssh
            git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signers.allowed"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
      - name: Build and validate distribution
        run: |
          python -m pip install -r requirements-ci.txt -e ".[learning,native,mcp,production]"
          python -m build
          python scripts/ci_validate.py
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_assets.py --tag "$RELEASE_TAG"
          else
            python scripts/release_assets.py
          fi
      - name: Attest exact distribution and checksum bytes
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Preserve attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/release/attestation-bundle.json
      - name: Verify attested repository, workflow and source ref
        run: |
          for asset in dist/release/*; do
            if [ "$(basename "$asset")" = attestation-bundle.json ]; then
              continue
            fi
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-distribution-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Create a new prerelease draft (never replace assets)
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS: refusing to replace historical assets"
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/release/* --verify-tag --draft --prerelease \
            --title "DAWLoop $RELEASE_TAG" --notes-file docs/RELEASE_NOTES_NEXT.md
