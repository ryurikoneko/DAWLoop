name: Bug report
description: Report a reproducible problem in DAWLoop.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Share only sanitized information. Do not attach private FL Studio projects, commercial audio, credentials, or plugin binaries.
  - type: input
    id: version
    attributes:
      label: DAWLoop version or commit
      placeholder: "Desktop Alpha version / Runtime release or commit"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component and distribution scope
      options:
        - Public Runtime / Agent
        - Desktop Alpha / Music Intelligence
        - Documentation / showcase
        - Unsure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and component runtime (if known)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and remove personal paths or project names.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove usernames, absolute paths, credentials, and unrelated project content.
    validations:
      required: false
