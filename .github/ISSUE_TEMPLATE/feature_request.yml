name: Feature request
description: Suggest a music workflow or developer experience to improve.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Describe the user problem and desired outcome. Avoid including private music or project files.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to create or do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would make this task easier?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Core timing or Note Plan
        - Verification
        - FL Studio adapter
        - Desktop / Music Intelligence
        - Documentation
        - Other
    validations:
      required: true
